<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beta</title>
<meta name="description" content="Beta is a microblogging site where every post lives in Topics. Short posts, big conversations!">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

</head>
